<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#F7F5F2">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<title>Recetas OXXO</title>
<meta name="description" content="Recetas, combinaciones y nuevas formas de disfrutar tus productos favoritos de OXXO.">
<script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.min.js"></script>
<style>
:root{--primary:#E30613;--primary-dark:#BF0009;--accent:#FFD000;--bg:#F7F5F2;--surface:#fff;--text:#151515;--muted:#77736F;--border:rgba(0,0,0,.07);--shadow:0 18px 55px rgba(20,20,20,.13)}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}html,body{margin:0;width:100%;height:100%}
body{min-height:100dvh;overflow:hidden;color:var(--text);font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Arial,sans-serif;background:radial-gradient(circle at 0 0,rgba(255,208,0,.13),transparent 32%),radial-gradient(circle at 100% 100%,rgba(227,6,19,.08),transparent 34%),var(--bg);transition:.4s}
body[data-theme="ramen"]{--primary:#BB181D;--primary-dark:#8D1014;--accent:#F4A900;--bg:#B9151B;--surface:#FFF8E9;--text:#27120D;--muted:#815A46;--border:rgba(91,25,12,.16)}
body[data-theme="ramen"]:before{content:"";position:fixed;inset:0;pointer-events:none;opacity:.15;background-image:radial-gradient(circle at 8% 20%,transparent 0 28px,#F6A900 29px 37px,transparent 38px),radial-gradient(circle at 91% 74%,transparent 0 30px,#F6A900 31px 39px,transparent 40px),linear-gradient(45deg,transparent 46%,rgba(255,190,0,.28) 47% 52%,transparent 53%);background-size:160px 160px,190px 190px,130px 130px}
.app{width:100%;max-width:540px;height:100dvh;margin:auto;display:grid;grid-template-rows:auto auto 1fr auto;position:relative;z-index:2}
.header{z-index:30;display:grid;grid-template-columns:minmax(0,1fr) auto;align-items:center;gap:10px;padding:calc(8px + env(safe-area-inset-top)) 14px 7px}
.cocktail-header{min-width:0;height:47px;display:flex;align-items:center}.cocktail-header img{display:block;width:auto;height:42px;max-width:100%;object-fit:contain;object-position:left center}
.ramen-header{display:none;min-width:0;height:47px;align-items:center}body[data-theme="ramen"] .ramen-header{display:flex}body[data-theme="ramen"] .cocktail-header{display:none}
.ramen-header img{display:block;width:auto;height:43px;max-width:100%;object-fit:contain;object-position:left center}
.header-actions{display:flex;align-items:center;gap:7px;flex-shrink:0}.page-number,.icon-button{border:1px solid var(--border);background:rgba(255,255,255,.94);box-shadow:0 5px 18px rgba(0,0,0,.05)}
body[data-theme="ramen"] .page-number,body[data-theme="ramen"] .icon-button{color:#FFF5E8;background:rgba(105,11,13,.65);border-color:rgba(255,205,78,.23)}
.page-number{min-width:52px;height:34px;padding:0 9px;display:flex;align-items:center;justify-content:center;border-radius:999px;color:#69645F;font-size:12px;font-weight:800}.icon-button{width:34px;height:34px;padding:0;border-radius:50%;display:grid;place-items:center;color:#37332F;cursor:pointer;font-size:16px}
.mode-wrapper{padding:1px 14px 8px}.mode-switch{position:relative;height:48px;padding:4px;display:grid;grid-template-columns:1fr 1fr;border-radius:18px;overflow:hidden;background:rgba(255,255,255,.84);border:1px solid rgba(0,0,0,.06);box-shadow:0 6px 22px rgba(0,0,0,.06);backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px)}
body[data-theme="ramen"] .mode-switch{background:rgba(93,8,10,.38);border-color:rgba(255,211,91,.22);box-shadow:0 7px 24px rgba(70,0,0,.18)}
.switch-slider{position:absolute;z-index:0;top:4px;left:4px;width:calc(50% - 4px);height:calc(100% - 8px);border-radius:14px;background:linear-gradient(145deg,#EA0B18,#C80009);box-shadow:0 5px 14px rgba(227,6,19,.22);transition:transform .38s cubic-bezier(.2,.8,.2,1),background .35s}
body[data-theme="ramen"] .switch-slider{transform:translateX(100%);background:linear-gradient(145deg,#F7AE00,#D98100);box-shadow:0 6px 17px rgba(246,169,0,.25)}
.mode-button{position:relative;z-index:2;border:0;background:transparent;display:flex;align-items:center;justify-content:center;gap:8px;border-radius:14px;color:#6D6863;font-size:11px;font-weight:900;letter-spacing:.45px;cursor:pointer}.mode-button svg{width:20px;height:20px}body[data-theme="cocktails"] #cocktailButton{color:#fff}body[data-theme="ramen"] #ramenButton{color:#31160C}body[data-theme="ramen"] #cocktailButton{color:#FFD6C7}
.content{position:relative;min-height:0;padding:3px 9px 7px}.viewer-shell{position:relative;width:100%;height:100%;overflow:hidden;border-radius:25px;background:var(--surface);border:1px solid var(--border);box-shadow:var(--shadow);transition:.4s}
body[data-theme="ramen"] .viewer-shell{box-shadow:0 20px 55px rgba(64,3,4,.31);border:2px solid rgba(246,169,0,.68)}.viewer-shell:before{content:"";position:absolute;z-index:16;left:0;right:0;top:0;height:4px;background:linear-gradient(90deg,var(--primary) 0 76%,var(--accent) 76% 100%)}body[data-theme="ramen"] .viewer-shell:before{height:6px;background:linear-gradient(90deg,#F6A900 0 68%,#B5161C 68% 100%)}
.ramen-decoration{display:none}body[data-theme="ramen"] .ramen-decoration{display:block}.ramen-japanese-left{position:absolute;z-index:17;left:8px;top:25%;writing-mode:vertical-rl;color:rgba(180,20,27,.20);font-size:14px;font-weight:900;pointer-events:none}.ramen-japanese-right{position:absolute;z-index:17;right:8px;top:62%;color:rgba(180,20,27,.18);font-size:14px;font-weight:900;pointer-events:none}
.progress-area{position:absolute;z-index:18;top:13px;left:18px;right:18px;height:3px;overflow:hidden;border-radius:999px;background:rgba(0,0,0,.07)}.progress{height:100%;width:0;border-radius:inherit;background:linear-gradient(90deg,var(--primary),var(--accent));transition:width .35s}.viewer{position:relative;width:100%;height:100%;overflow:hidden;background:linear-gradient(180deg,#fff,#FCFBF9);touch-action:pan-y;user-select:none;-webkit-user-select:none;transition:.35s}body[data-theme="ramen"] .viewer{background:linear-gradient(180deg,#FFF9EB,#FFF2D2)}
.track{width:100%;height:100%;display:flex;will-change:transform;transition:transform .40s cubic-bezier(.22,.72,.24,1)}.slide{flex:0 0 100%;width:100%;height:100%;display:flex;align-items:center;justify-content:center;padding:22px 4px 7px;overflow:hidden}canvas{display:block;max-width:100%;max-height:100%}
.loading{position:absolute;inset:0;z-index:100;display:flex;align-items:center;justify-content:center;flex-direction:column;gap:13px;background:var(--surface)}.loader-icon{width:42px;height:42px;display:grid;place-items:center;border-radius:14px;color:#fff;background:var(--primary);font-size:19px;font-weight:900}body[data-theme="ramen"] .loader-icon{color:#4C2109;background:var(--accent)}.loader-title{font-size:15px;font-weight:850}.loader-bar{width:130px;height:4px;overflow:hidden;border-radius:999px;background:rgba(0,0,0,.09)}.loader-bar:after{content:"";display:block;width:45%;height:100%;border-radius:inherit;background:var(--primary);animation:loadingBar 1.05s ease-in-out infinite}body[data-theme="ramen"] .loader-bar:after{background:var(--accent)}@keyframes loadingBar{0%{transform:translateX(-110%)}100%{transform:translateX(290%)}}.loading small{color:var(--muted);font-size:10px;font-weight:650}
.error{position:absolute;inset:0;z-index:120;display:none;align-items:center;justify-content:center;padding:30px;text-align:center;background:var(--surface)}.error-icon{width:48px;height:48px;margin:0 auto 14px;display:grid;place-items:center;border-radius:15px;color:var(--primary);font-size:22px;font-weight:900;background:rgba(227,6,19,.09)}.error strong{display:block;margin-bottom:7px;font-size:16px}.error p{margin:0;color:var(--muted);font-size:12px;line-height:1.5}
.swipe-hint{position:absolute;z-index:25;left:50%;bottom:18px;transform:translateX(-50%);display:flex;align-items:center;gap:8px;padding:9px 14px;border-radius:999px;color:#fff;font-size:11px;font-weight:750;white-space:nowrap;pointer-events:none;background:rgba(17,17,17,.80);backdrop-filter:blur(12px);-webkit-backdrop-filter:blur(12px);box-shadow:0 7px 20px rgba(0,0,0,.18);transition:opacity .35s,transform .35s}body[data-theme="ramen"] .swipe-hint{color:#3A1609;background:rgba(248,177,0,.93)}.swipe-hint.hide{opacity:0;transform:translate(-50%,8px)}
.final-cta{position:absolute;z-index:45;left:17px;right:17px;bottom:18px;opacity:0;visibility:hidden;transform:translateY(15px);transition:.35s}.final-cta.visible{opacity:1;visibility:visible;transform:translateY(0)}.final-cta a{min-height:55px;padding:10px 15px;display:grid;grid-template-columns:39px 1fr 22px;align-items:center;gap:10px;text-decoration:none;color:#fff;border-radius:18px;background:rgba(14,14,14,.95);box-shadow:0 13px 34px rgba(0,0,0,.27)}body[data-theme="ramen"] .final-cta a{color:#3F1809;background:#F4A900;border:2px solid #A20F14}.cta-icon{width:39px;height:39px;display:grid;place-items:center;border-radius:12px;font-size:18px;font-weight:900;background:linear-gradient(135deg,#25F4EE,#FE2C55)}body[data-theme="ramen"] .cta-icon{color:#FFF7E4;background:#B5161C}.cta-copy{min-width:0;display:flex;flex-direction:column;gap:2px}.cta-copy strong{font-size:13px;font-weight:850}.cta-copy small{overflow:hidden;text-overflow:ellipsis;white-space:nowrap;color:rgba(255,255,255,.67);font-size:9px;font-weight:600}body[data-theme="ramen"] .cta-copy small{color:rgba(58,23,7,.70)}
.navigation{display:grid;grid-template-columns:54px 1fr 54px;align-items:center;gap:10px;padding:9px 15px calc(10px + env(safe-area-inset-bottom))}.nav-button{width:50px;height:50px;padding:0;border:0;border-radius:17px;display:grid;place-items:center;cursor:pointer;color:#fff;font-size:27px;background:linear-gradient(145deg,var(--primary),var(--primary-dark));box-shadow:0 9px 24px rgba(80,0,0,.22);transition:.2s}.nav-button:active{transform:scale(.92)}.nav-button:disabled{opacity:.18;box-shadow:none}body[data-theme="ramen"] .nav-button{color:#481B08;background:linear-gradient(145deg,#FFBC13,#E69300);border:2px solid rgba(121,15,18,.42);box-shadow:0 9px 24px rgba(83,4,7,.30)}
.dots{min-width:0;display:flex;align-items:center;justify-content:center;gap:7px}.dot{width:7px;height:7px;padding:0;border:0;border-radius:50%;background:rgba(170,164,158,.65);transition:all .28s}.dot.active{width:25px;border-radius:999px;background:var(--primary)}body[data-theme="ramen"] .dot{background:rgba(255,220,133,.50)}body[data-theme="ramen"] .dot.active{background:var(--accent)}
@media(max-width:390px){.header{padding-left:10px;padding-right:10px;gap:7px}.cocktail-header,.ramen-header{height:43px}.cocktail-header img,.ramen-header img{height:38px}.mode-wrapper{padding-left:10px;padding-right:10px}.content{padding-left:7px;padding-right:7px}}
@media(min-width:650px){body{padding:18px}.app{height:calc(100dvh - 36px)}.viewer-shell{border-radius:30px}}
@media(prefers-reduced-motion:reduce){.track,.switch-slider{transition:none}}
</style>
</head>
<body data-theme="cocktails">
<main class="app">
<header class="header">
  <div class="cocktail-header" id="cocktailHeader">
    <img src="./header.png" onerror="this.onerror=null;this.src='./header.png';" alt="OXXO Cócteles y Bebidas">
  </div>
  <div class="ramen-header" id="ramenHeader">
    <img src="./header-ramen.PNG.PNG" onerror="this.onerror=null;this.src='./header-ramen.png';" alt="OXXO Ramen · recetas y combinaciones">
  </div>
  <div class="header-actions"><div class="page-number" id="counter">· / ·</div><button class="icon-button" id="fullscreen" type="button" aria-label="Pantalla completa">⛶</button></div>
</header>

<section class="mode-wrapper">
  <div class="mode-switch">
    <div class="switch-slider"></div>
    <button class="mode-button" id="cocktailButton" type="button">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M4 4h16l-7 8v6"/><path d="M9 21h8"/><path d="M13 18v3"/></svg>
      CÓCTELES
    </button>
    <button class="mode-button" id="ramenButton" type="button">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M3 11h18c-1 6-4 9-9 9s-8-3-9-9Z"/><path d="M5 21h14"/><path d="M8 8c-3-4 3-4 0-7"/><path d="M13 8c-3-4 3-4 0-7"/><path d="M18 8c-3-4 3-4 0-7"/></svg>
      RAMEN
    </button>
  </div>
</section>

<section class="content">
  <div class="viewer-shell">
    <div class="ramen-decoration ramen-japanese-left">ラーメン</div>
    <div class="ramen-decoration ramen-japanese-right">おいしい</div>
    <div class="progress-area"><div class="progress" id="progress"></div></div>
    <div class="viewer" id="viewer">
      <div class="track" id="track"></div>
      <div class="loading" id="loading"><div class="loader-icon" id="loaderIcon">✦</div><div class="loader-title" id="loaderTitle">Preparando tus recetas</div><div class="loader-bar"></div><small id="loaderSubtitle">Cargando recetario...</small></div>
      <div class="error" id="error"><div><div class="error-icon">!</div><strong>No pudimos cargar este recetario</strong><p id="errorText">Revisa que el archivo esté correctamente cargado.</p></div></div>
      <div class="swipe-hint" id="hint"><span>←</span><span id="hintText">Desliza para descubrir</span><span>→</span></div>
      <div class="final-cta" id="finalCTA"><a id="ctaLink" href="#" target="_blank" rel="noopener"><div class="cta-icon" id="ctaIcon">♪</div><div class="cta-copy"><strong id="ctaTitle">¿Quieres más ideas?</strong><small id="ctaSubtitle">Más preparaciones en TikTok</small></div><div>›</div></a></div>
    </div>
  </div>
</section>

<nav class="navigation"><button class="nav-button" id="prev" type="button" aria-label="Página anterior">‹</button><div class="dots" id="dots"></div><button class="nav-button" id="next" type="button" aria-label="Página siguiente">›</button></nav>
</main>

<script>
const CONFIG={
  cocktails:{pdf:"./recetario.pdf",tiktok:"https://www.tiktok.com/discover/buzz-ballz-mexico-oxxo",loaderTitle:"Preparando tus cócteles",loaderSubtitle:"Cargando recetas...",hint:"Desliza para descubrir",ctaTitle:"¿Quieres más ideas?",ctaSubtitle:"Descubre más preparaciones en TikTok",ctaIcon:"♪"},
  ramen:{pdf:"./ramen.pdf",tiktok:"https://www.tiktok.com/discover/ramen-mexico-oxxo",loaderTitle:"Preparando tu ramen",loaderSubtitle:"Cargando recetas y combinaciones...",hint:"Desliza para descubrir sabores",ctaTitle:"¿Quieres más recetas?",ctaSubtitle:"Descubre más ramen en TikTok",ctaIcon:"🍜"}
};
pdfjsLib.GlobalWorkerOptions.workerSrc="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.worker.min.js";
const body=document.body,track=document.getElementById("track"),viewer=document.getElementById("viewer"),counter=document.getElementById("counter"),progress=document.getElementById("progress"),loading=document.getElementById("loading"),errorBox=document.getElementById("error"),errorText=document.getElementById("errorText"),prev=document.getElementById("prev"),next=document.getElementById("next"),dotsContainer=document.getElementById("dots"),hint=document.getElementById("hint"),hintText=document.getElementById("hintText"),finalCTA=document.getElementById("finalCTA"),ctaLink=document.getElementById("ctaLink"),ctaTitle=document.getElementById("ctaTitle"),ctaSubtitle=document.getElementById("ctaSubtitle"),ctaIcon=document.getElementById("ctaIcon"),fullscreen=document.getElementById("fullscreen"),cocktailButton=document.getElementById("cocktailButton"),ramenButton=document.getElementById("ramenButton"),loaderTitle=document.getElementById("loaderTitle"),loaderSubtitle=document.getElementById("loaderSubtitle");
let currentTheme="cocktails",pdf=null,currentPage=0,totalPages=0,slides=[],startX=0,startY=0;const pageMemory={cocktails:0,ramen:0};
function getInitialTheme(){const p=new URLSearchParams(location.search);return p.get("mode")==="ramen"?"ramen":"cocktails"}
function updateURL(){const u=new URL(location.href);u.searchParams.set("mode",currentTheme);history.replaceState({},"",u)}
function applyTheme(){body.dataset.theme=currentTheme;const c=CONFIG[currentTheme];hintText.textContent=c.hint;loaderTitle.textContent=c.loaderTitle;loaderSubtitle.textContent=c.loaderSubtitle;ctaTitle.textContent=c.ctaTitle;ctaSubtitle.textContent=c.ctaSubtitle;ctaIcon.textContent=c.ctaIcon;ctaLink.href=c.tiktok;document.querySelector('meta[name="theme-color"]').setAttribute("content",currentTheme==="ramen"?"#B9151B":"#F7F5F2")}
async function changeTheme(theme){if(theme===currentTheme)return;pageMemory[currentTheme]=currentPage;currentTheme=theme;applyTheme();updateURL();await loadPDF(pageMemory[currentTheme])}
async function loadPDF(desiredPage=0){loading.style.display="flex";errorBox.style.display="none";finalCTA.classList.remove("visible");counter.textContent="· / ·";progress.style.width="0%";track.innerHTML="";dotsContainer.innerHTML="";slides=[];try{if(pdf&&typeof pdf.destroy==="function")await pdf.destroy()}catch(e){}pdf=null;currentPage=0;totalPages=0;try{const cfg=CONFIG[currentTheme];pdf=await pdfjsLib.getDocument({url:cfg.pdf}).promise;totalPages=pdf.numPages;createSlides();createDots();currentPage=Math.max(0,Math.min(desiredPage,totalPages-1));await renderPage(currentPage);renderPage(currentPage+1);renderPage(currentPage-1);loading.style.display="none";updateUI();hint.classList.remove("hide");setTimeout(()=>hint.classList.add("hide"),4200)}catch(err){console.error(err);loading.style.display="none";errorBox.style.display="flex";errorText.innerHTML=currentTheme==="ramen"?"Verifica que <b>ramen.pdf</b> esté en la misma carpeta que index.html.":"Verifica que <b>recetario.pdf</b> esté en la misma carpeta que index.html."}}
function createSlides(){track.innerHTML="";slides=[];for(let i=0;i<totalPages;i++){const s=document.createElement("article"),c=document.createElement("canvas");s.className="slide";c.setAttribute("aria-label",`Página ${i+1}`);s.appendChild(c);track.appendChild(s);slides.push({canvas:c,rendered:false,rendering:false})}}
async function renderPage(index,force=false){if(index<0||index>=totalPages)return;const item=slides[index];if(item.rendering||(item.rendered&&!force))return;item.rendering=true;try{const page=await pdf.getPage(index+1),base=page.getViewport({scale:1}),fit=Math.min((viewer.clientWidth-8)/base.width,(viewer.clientHeight-29)/base.height),ratio=Math.min(devicePixelRatio||1,2),vp=page.getViewport({scale:fit*ratio}),c=item.canvas;c.width=Math.round(vp.width);c.height=Math.round(vp.height);c.style.width=`${vp.width/ratio}px`;c.style.height=`${vp.height/ratio}px`;const ctx=c.getContext("2d",{alpha:false});ctx.fillStyle="#fff";ctx.fillRect(0,0,c.width,c.height);await page.render({canvasContext:ctx,viewport:vp}).promise;item.rendered=true}catch(err){console.error(`Error página ${index+1}`,err)}finally{item.rendering=false}}
function createDots(){dotsContainer.innerHTML="";for(let i=0;i<totalPages;i++){const d=document.createElement("button");d.type="button";d.className="dot";d.setAttribute("aria-label",`Página ${i+1}`);d.addEventListener("click",()=>goTo(i));dotsContainer.appendChild(d)}}
function updateUI(){track.style.transform=`translateX(-${currentPage*100}%)`;counter.textContent=`${currentPage+1} / ${totalPages}`;progress.style.width=`${((currentPage+1)/totalPages)*100}%`;prev.disabled=currentPage===0;next.disabled=currentPage===totalPages-1;document.querySelectorAll(".dot").forEach((d,i)=>d.classList.toggle("active",i===currentPage));finalCTA.classList.toggle("visible",Boolean(CONFIG[currentTheme].tiktok)&&currentPage===totalPages-1);pageMemory[currentTheme]=currentPage}
async function goTo(index){const n=Math.max(0,Math.min(index,totalPages-1));if(n===currentPage)return;currentPage=n;updateUI();await renderPage(currentPage);renderPage(currentPage+1);renderPage(currentPage-1)}
prev.addEventListener("click",()=>goTo(currentPage-1));next.addEventListener("click",()=>goTo(currentPage+1));cocktailButton.addEventListener("click",()=>changeTheme("cocktails"));ramenButton.addEventListener("click",()=>changeTheme("ramen"));
viewer.addEventListener("touchstart",e=>{const t=e.touches[0];startX=t.clientX;startY=t.clientY},{passive:true});viewer.addEventListener("touchend",e=>{const t=e.changedTouches[0],dx=t.clientX-startX,dy=t.clientY-startY;if(Math.abs(dx)>45&&Math.abs(dx)>Math.abs(dy)*1.12)goTo(dx<0?currentPage+1:currentPage-1)},{passive:true});
document.addEventListener("keydown",e=>{if(e.key==="ArrowRight")goTo(currentPage+1);if(e.key==="ArrowLeft")goTo(currentPage-1)});fullscreen.addEventListener("click",async()=>{try{if(!document.fullscreenElement)await document.documentElement.requestFullscreen();else await document.exitFullscreen()}catch(e){console.log("Fullscreen no disponible")}});
let resizeTimer;window.addEventListener("resize",()=>{clearTimeout(resizeTimer);resizeTimer=setTimeout(async()=>{if(!pdf)return;await renderPage(currentPage,true);renderPage(currentPage+1,true)},300)});
window.addEventListener("load",async()=>{currentTheme=getInitialTheme();applyTheme();await loadPDF(0)});
</script>
</body>
</html>
